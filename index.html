<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Baby Centaur Chess</title>
  <link rel="stylesheet" href="style.css?v=15" />

  <!--
    No build step. This page uses ES modules + import maps, which require
    serving over HTTP (not file://) because module scripts and Web Workers
    are blocked on file:// in most browsers. Run one of:
      python3 -m http.server 8000
      npx serve .
    then open http://localhost:8000
  -->
  <script type="importmap">
  {
    "imports": {
      "chess.js": "https://cdn.jsdelivr.net/npm/chess.js@1.0.0/dist/esm/chess.js"
    }
  }
  </script>
</head>
<body>
  <header class="app-header">
    <h1>Baby Centaur Chess</h1>
    <button class="friend-btn" id="friend-btn" type="button">Play with a friend</button>
  </header>

  <main class="layout">
    <section class="board-column">
      <div class="board-row">
        <div class="scene-container" id="scene-container">
          <div class="toast" id="toast"></div>
          <div class="promo-picker hidden" id="promo-picker">
            <div class="promo-card">
              <div class="promo-title">Your pawn made it! Pick a piece.</div>
              <div class="promo-row" id="promo-row"></div>
              <div class="promo-note" id="promo-note"></div>
            </div>
          </div>
        </div>
        <div class="eval-bar" id="eval-bar" title="Evaluation from White's perspective">
          <div class="eval-fill" id="eval-fill"></div>
          <span class="eval-label" id="eval-label">+0.0</span>
        </div>
        <div class="message-box">
          <p class="message-text" id="message-text">White to move</p>
          <button class="play-again-btn hidden" id="play-again" type="button">Play again</button>
        </div>
        <div class="captured-box">
          <div class="captured-row"><span class="captured-label">White took</span><span class="captured-icons" id="captured-by-white"></span></div>
          <div class="captured-row"><span class="captured-label">Black took</span><span class="captured-icons" id="captured-by-black"></span></div>
        </div>
      </div>
    </section>
  </main>

  <div class="lobby hidden" id="lobby">
    <div class="lobby-card">
      <h2>Play with a friend</h2>
      <p class="lobby-status" id="lobby-status">Making your game link...</p>
      <input class="lobby-link hidden" id="lobby-link" readonly />
      <div class="lobby-row">
        <button class="lobby-btn hidden" id="lobby-share" type="button">Share link</button>
        <button class="lobby-btn hidden" id="lobby-copy" type="button">Copy link</button>
        <button class="lobby-btn" id="lobby-cancel" type="button">Back</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js?v=15"></script>
</body>
</html>
